<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3835"/>
      <stop offset="100%" stop-color="#2C2A26"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <!-- Grid/Dashboard icon -->
  <g transform="translate(100, 110)" stroke="#ffffff" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer frame -->
    <rect x="0" y="0" width="312" height="280" rx="16"/>
    <!-- Horizontal dividers -->
    <line x1="0" y1="70" x2="312" y2="70"/>
    <line x1="0" y1="140" x2="312" y2="140"/>
    <line x1="0" y1="210" x2="312" y2="210"/>
    <!-- Vertical divider -->
    <line x1="104" y1="0" x2="104" y2="280"/>
    <!-- Header row text lines -->
    <line x1="24" y1="35" x2="80" y2="35" stroke-width="10" opacity="0.6"/>
    <line x1="128" y1="35" x2="288" y2="35" stroke-width="10" opacity="0.6"/>
    <!-- Row content hints -->
    <line x1="24" y1="105" x2="80" y2="105" stroke-width="6" opacity="0.4"/>
    <line x1="128" y1="105" x2="240" y2="105" stroke-width="6" opacity="0.4"/>
    <line x1="24" y1="175" x2="80" y2="175" stroke-width="6" opacity="0.4"/>
    <line x1="128" y1="175" x2="220" y2="175" stroke-width="6" opacity="0.4"/>
    <line x1="24" y1="245" x2="80" y2="245" stroke-width="6" opacity="0.4"/>
    <line x1="128" y1="245" x2="260" y2="245" stroke-width="6" opacity="0.4"/>
  </g>
  <!-- Red status dots -->
  <circle cx="390" cy="215" r="10" fill="#E00028"/>
  <circle cx="390" cy="285" r="10" fill="#E00028" opacity="0.5"/>
  <circle cx="390" cy="355" r="10" fill="#33cc66"/>
</svg>
